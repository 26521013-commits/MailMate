<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MailMate - Trợ Lý Soạn Thư AI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-top">
          <h1>MailMate 📧</h1>
          <button id="theme-toggle" class="btn outline">🌙 Chế độ Đêm</button>
        </div>
        <p>Trợ lý hỗ trợ soạn thư thông minh cho sinh viên & người đi làm</p>
      </header>

      <main class="workspace">
        <!-- Cột trái -->
        <section class="input-section">
          <h2>Thông tin & Cấu hình</h2>

          <div class="form-row">
            <div class="form-group">
              <label for="student-name"
                >Họ và tên <span class="required">(*)</span>:</label
              >
              <input
                type="text"
                id="student-name"
                placeholder="VD: Nguyễn Văn A"
              />
              <small class="error-text" id="err-student-name"></small>
            </div>
            <div class="form-group">
              <label for="student-class"
                >Lớp học <span class="required">(*)</span>:</label
              >
              <input type="text" id="student-class" placeholder="VD: 12C3" />
              <small class="error-text" id="err-student-class"></small>
            </div>
          </div>

          <div class="form-group">
            <label for="student-id"
              >Mã số (MSSV) <span class="required">(*)</span>:</label
            >
            <input type="text" id="student-id" placeholder="VD: 26521013" />
            <small class="error-text" id="err-student-id"></small>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="teacher-name"
                >Tên Giảng viên <span class="required">(*)</span>:</label
              >
              <input
                type="text"
                id="teacher-name"
                placeholder="VD: Cô Lê Hằng"
              />
              <small class="error-text" id="err-teacher-name"></small>
            </div>
            <div class="form-group">
              <label for="recipient-email"
                >Email gửi đến <span class="required">(*)</span>:</label
              >
              <input
                type="email"
                id="recipient-email"
                placeholder="VD: gvien@truong.edu.vn"
              />
              <small class="error-text" id="err-recipient-email"></small>
            </div>
          </div>

          <div class="form-group">
            <label for="topic">Chủ đề email:</label>
            <select id="topic">
              <option value="nghi-hoc">Xin nghỉ học / nghỉ làm</option>
              <option value="nop-tre">Xin nộp bài trễ</option>
              <option value="ung-tuyen">Ứng tuyển / Xin thực tập</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ai-model">Mô hình AI:</label>
              <select id="ai-model">
                <option value="gemini">Google Gemini</option>
                <option value="gpt">ChatGPT</option>
              </select>
            </div>
            <div class="form-group">
              <label for="language">Ngôn ngữ:</label>
              <select id="language">
                <option value="vi">Tiếng Việt</option>
                <option value="en">Tiếng Anh</option>
                <option value="ja">Tiếng Nhật</option>
              </select>
            </div>
          </div>

          <div class="form-group flex-grow">
            <label for="prompt"
              >Lý do chi tiết <span class="required">(*)</span>:</label
            >
            <textarea
              id="prompt"
              placeholder="VD: Em bị sốt cấp tính, không thể di chuyển..."
            ></textarea>
            <small class="error-text" id="err-prompt"></small>
          </div>

          <button id="generate-btn" class="btn primary">
            ✨ AI Soạn Email Ngay
          </button>
        </section>

        <!-- Cột phải -->
        <section class="output-section">
          <h2>Nội dung Email</h2>

          <div class="form-group">
            <label for="email-subject">Tiêu đề (Subject):</label>
            <input
              type="text"
              id="email-subject"
              placeholder="Tiêu đề thư..."
            />
          </div>

          <div class="form-group flex-grow">
            <label for="email-body">Nội dung (Body):</label>
            <textarea
              id="email-body"
              placeholder="Nội dung tạo bởi AI sẽ xuất hiện ở đây..."
            ></textarea>
          </div>

          <div class="action-buttons">
            <button id="copy-btn" class="btn secondary">📋 Sao chép</button>
            <button id="save-draft-btn" class="btn secondary">
              💾 Lưu nháp
            </button>
            <button id="send-direct-btn" class="btn success">
              🚀 Gửi (Gmail)
            </button>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
